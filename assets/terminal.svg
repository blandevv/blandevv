<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="Terminal: whoami, cat stack.txt" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8ef0bd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8ef0bd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8ef0bd" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect class="t1" x="44" y="62" width="0" height="26"/></clipPath>
    <clipPath id="c2"><rect class="t2" x="44" y="124" width="0" height="26"/></clipPath>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
    }
    .dim   { fill: #7b959d; }
    .mute  { fill: #8ca6ad; }
    .txt   { fill: #e9f3f2; }
    .accent { fill: #8ef0bd; }
    .hide  { opacity: 0; animation: show 0.4s ease-out forwards; }
    .t1 { animation: type1 0.7s steps(6) 0.5s forwards; }
    .t2 { animation: type2 1.1s steps(13) 2.3s forwards; }
    .cursor { opacity: 0; animation: appear 0.01s 5.2s forwards, blink 1.1s steps(1) 5.2s infinite; }
    @keyframes type1 { to { width: 52px; } }
    @keyframes type2 { to { width: 112px; } }
    @keyframes show  { to { opacity: 1; } }
    @keyframes appear { to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="639" height="319" rx="12" fill="#080d12" stroke="#2a3b48"/>
  <rect x="20" y="0.5" width="600" height="1" fill="url(#glow)"/>
  <line x1="0.5" y1="40.5" x2="639.5" y2="40.5" stroke="#16242f"/>
  <circle cx="24" cy="20.5" r="5" fill="#ff8b82"/>
  <circle cx="42" cy="20.5" r="5" fill="#f0c274"/>
  <circle cx="60" cy="20.5" r="5" fill="#8ef0bd"/>
  <text x="320" y="25" text-anchor="middle" class="mute" font-size="12">blandevv: ~</text>

  <!-- 1 -->
  <text x="24" y="80" class="accent">$</text>
  <text x="44" y="80" class="accent" clip-path="url(#c1)">whoami</text>
  <text x="24" y="106" class="hide" style="animation-delay:1.35s">
    <tspan class="txt">Jacobo</tspan><tspan class="mute"> · Software Engineer · Backend &amp; Full-Stack</tspan>
  </text>

  <!-- 2 -->
  <text x="24" y="142" class="accent hide" style="animation-delay:2.2s">$</text>
  <text x="44" y="142" class="accent" clip-path="url(#c2)">cat stack.txt</text>

  <g class="hide" style="animation-delay:3.5s">
    <text x="24" y="170" class="dim">languages</text>
    <text x="128" y="170" class="txt">Java · Python · TypeScript</text>
  </g>
  <g class="hide" style="animation-delay:3.8s">
    <text x="24" y="194" class="dim">backend</text>
    <text x="128" y="194" class="txt">Spring Boot · FastAPI</text>
  </g>
  <g class="hide" style="animation-delay:4.1s">
    <text x="24" y="218" class="dim">frontend</text>
    <text x="128" y="218" class="txt">Angular · React · Next.js · Tailwind CSS</text>
  </g>
  <g class="hide" style="animation-delay:4.4s">
    <text x="24" y="242" class="dim">data</text>
    <text x="128" y="242" class="txt">MySQL · PostgreSQL</text>
  </g>
  <g class="hide" style="animation-delay:4.7s">
    <text x="24" y="266" class="dim">tools</text>
    <text x="128" y="266" class="txt">Docker · Git</text>
  </g>

  <!-- 3 -->
  <text x="24" y="302" class="accent hide" style="animation-delay:5.1s">$</text>
  <rect class="cursor" x="44" y="289" width="8" height="16" fill="#8ef0bd"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
